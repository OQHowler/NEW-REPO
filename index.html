*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--ink); color: var(--bone); }
html { overscroll-behavior: none; }
body {
  margin: 0; overflow: hidden; font-family: var(--font-ui); font-size: 16px; font-weight: 600; line-height: 1.3;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
svg { display: block; }

#app {
  position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden;
  padding: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) var(--safe-area-inset-right, env(safe-area-inset-right, 0px)) var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)) var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
}
#bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.screen { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 560px; margin: 0 auto; }

/* ---------- Chips & buttons ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px; border-radius: 999px;
  background: rgba(0, 0, 0, 0.38); border: 1px solid var(--edge); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 64px;
}
.chip svg { width: 22px; height: 22px; flex: none; }
.chip.small { padding: 2px 9px 2px 4px; min-width: 0; font-size: 15px; }
.chip.small svg { width: 19px; height: 19px; }
.chip.bump { animation: bump 0.35s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 8px 22px;
  border-radius: 18px; font-weight: 800; font-size: 19px; letter-spacing: 0.01em; transition: transform 0.08s ease, filter 0.15s;
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.42); position: relative;
}

/* ---------- Home ---------- */
#home { justify-content: space-between; padding: 12px 18px 16px; gap: 10px; }

.hero { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }

.logo {

}
.tag { margin: 6px 0 2px; color: var(--dust); font-size: 17px; font-weight: 700; }

.actions { display: flex; flex-direction: column; gap: 12px; }

.dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.dock button {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 16px;
  background: rgba(0, 0, 0, 0.32); border: 1px solid var(--edge); font-size: 13px; font-weight: 800; color: var(--bone); position: relative;
}
.dock button svg { width: 28px; height: 28px; }
.dock button:active { transform: translateY(2px); }
.dot { position: absolute; top: 6px; right: 14px; width: 11px; height: 11px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 0 2px var(--ink); }

/* ---------- Game ---------- */
#game { padding: 6px 10px 8px; gap: 4px; }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }

.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: rgba(0, 0, 0, 0.38); border: 1px solid var(--edge); }
.icon-btn svg { width: 22px; height: 22px; }
.depth { text-align: center; line-height: 1; }
.depth b { font-family: var(--font-display); font-weight: 400; font-size: 34px; color: var(--bone); font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.5); }
.depth span { font-family: var(--font-display); font-size: 16px; color: var(--dust); margin-left: 2px; }
.depth small { display: block; margin-top: 3px; font-size: 13px; font-weight: 800; color: var(--biome-accent, var(--dust)); letter-spacing: 0.06em; text-transform: uppercase; }
.subhud { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 2px; }
.beams { display: flex; gap: 3px; align-items: center; }
.beams svg { width: 26px; height: 22px; }
.beams .broken { opacity: 0.25; filter: grayscale(1); }
.beams.hit { animation: shake 0.4s; }
@keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.rise { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; color: var(--dust); padding: 3px 10px; border-radius: 999px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--edge); }
.rise b { font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--bone); min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.rise .bar { width: 46px; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; display: block; }
.rise .bar i { display: block; height: 100%; width: 0%; background: var(--lamp); border-radius: 4px; transition: width 0.25s; }
.rise.soon { color: var(--ember); border-color: rgba(255, 107, 79, 0.5); animation: pulse 0.9s infinite; }
.rise.soon .bar i { background: var(--ember); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255, 107, 79, 0.18); } }
#stage { position: relative; flex: 1; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.boosters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 6px; }
.boost {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 16px;
  background: linear-gradient(#3d2e23, #2a1f17); border: 1px solid var(--edge); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
  font-size: 14px; font-weight: 800; color: var(--bone);
}
.boost svg { width: 30px; height: 30px; }
.boost .n {
  position: absolute; top: -7px; right: -4px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; display: grid; place-items: center;
  background: var(--lamp); color: #2a1804; font-size: 14px; font-weight: 800; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
}
.boost .n.zero { background: #5b4a3c; color: var(--bone); }
.boost.active { background: linear-gradient(#ffd977, var(--lamp)); color: #2a1804; }
.boost:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.45); }
.boost[disabled] { opacity: 0.4; pointer-events: none; }
#coach {
  position: absolute; left: 50%; top: 12%; transform: translateX(-50%); width: min(92%, 380px); text-align: center; pointer-events: none;
  background: var(--bone); color: #2a1a0e; border-radius: 16px; padding: 10px 14px; font-size: 16px; font-weight: 800; line-height: 1.25;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5); animation: coachIn 0.3s ease-out;
}
@keyframes coachIn { from { opacity: 0; transform: translate(-50%, -8px); } }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--shade); padding: 16px; animation: fade 0.18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet {

}
@keyframes rise-in { from { transform: translateY(26px) scale(0.96); opacity: 0; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; text-align: center; color: var(--lamp); line-height: 1.05; text-wrap: balance; }

.sheet .close { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(0, 0, 0, 0.3); }

.big-num { text-align: center; font-family: var(--font-display); font-size: 58px; line-height: 1; color: var(--bone); text-shadow: 0 4px 0 rgba(0, 0, 0, 0.5); }

.ribbon { align-self: center; padding: 4px 14px; border-radius: 999px; background: var(--moss); color: #10260a; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; }
.loot { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

.stat-list { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; color: var(--dust); }

.list { display: flex; flex-direction: column; gap: 10px; }
.item {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px;
  background: rgba(0, 0, 0, 0.28); border: 1px solid var(--edge); text-align: left;
}
.item .ico { width: 44px; height: 44px; display: grid; place-items: center; font-size: 28px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); }
.item .ico svg { width: 30px; height: 30px; }

.prog { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin-top: 5px; }

.museum { display: flex; flex-direction: column; gap: 12px; }

/* Poki: reward buttons are not green and carry a 🎬; a reward button never outsizes the standard option */
.poki-ads .btn.gem { background: linear-gradient(#c3b6ff, #8f7dff 50%, #5c48d9); color: #120a30; }

html.wide #home { max-width: 1000px; display: grid; grid-template-columns: 1.1fr 1fr; grid-template-rows: auto 1fr auto; column-gap: 28px; row-gap: 10px; padding: 10px 24px 14px; }

@media (max-height: 640px) {

}

}

<script>
(function () {
'use strict';
/* UNDERGRID engine: pure game rules, no DOM. Shared by the game, the tests and the balance simulator. */
(function (root) {
  'use strict';

  var COLS = 8, ROWS = 10, N = COLS * ROWS;
  var BIOME_STARTS = [0, 15, 35, 60, 90, 125, 165, 210];   // depth (m) where each biome begins
  // Tunables (balanced with test/sim.mjs)
  var CFG = {
    startRows: 5,                                  // terrain rows on the board when a run starts
    hearts: 3,                                     // support beams: a cave-in crushes the top row and costs one
    minTerrain: 0,                                 // keep at least this many terrain rows: extra rows rise when you dig through
    rise: [[0, 12], [15, 11], [35, 10], [60, 9], [90, 8], [125, 7], [165, 6], [210, 5]], // [from depth, moves between ground rises]
    help: [0.85, 300, 0.35],                       // chance a dealt tray has a line-completing piece: start, fall-off, floor
    smallBias: 1.3                                 // weight multiplier for 1-3 cell pieces
  };

  // Cell encoding: kind (4 bits) | tint (4 bits) | variant (8 bits)
  var K = { EMPTY: 0, BLOCK: 1, DIRT: 2, STONE: 3, CRACK: 4, GOLD: 5, GEM: 6, CHEST: 7, TNT: 8, RELIC: 9 };
  function kind(v) { return v & 15; }
  function tint(v) { return (v >> 4) & 15; }
  function vari(v) { return (v >> 8) & 255; }
  function mk(k, t, va) { return (k & 15) | ((t & 15) << 4) | ((va & 255) << 8); }

  // ---------- RNG (mulberry32), serialisable ----------
  function rng(seed) {
    var a = seed | 0;
    function next() {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    next.state = function () { return a; };
    next.set = function (s) { a = s | 0; };
    next.int = function (n) { return Math.floor(next() * n); };
    next.pick = function (arr) { return arr[Math.floor(next() * arr.length)]; };
    return next;
  }
  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // ---------- Pieces ----------
  var SHAPE_DEFS = [
    ['o1', [[0, 0]], 7],
    ['i2h', [[0, 0], [0, 1]], 5], ['i2v', [[0, 0], [1, 0]], 5],
    ['i3h', [[0, 0], [0, 1], [0, 2]], 4], ['i3v', [[0, 0], [1, 0], [2, 0]], 4],
    ['i4h', [[0, 0], [0, 1], [0, 2], [0, 3]], 2.4], ['i4v', [[0, 0], [1, 0], [2, 0], [3, 0]], 2.4],
    ['i5h', [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]], 0.9], ['i5v', [[0, 0], [1, 0], [2, 0], [3, 0], [4, 0]], 0.9],
    ['o4', [[0, 0], [0, 1], [1, 0], [1, 1]], 4],
    ['o9', [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]], 0.6],
    ['r6h', [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]], 0.9],
    ['r6v', [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1]], 0.9],
    ['l3a', [[0, 0], [1, 0], [1, 1]], 2.6], ['l3b', [[0, 0], [0, 1], [1, 0]], 2.6],
    ['l3c', [[0, 0], [0, 1], [1, 1]], 2.6], ['l3d', [[0, 1], [1, 0], [1, 1]], 2.6],
    ['l4a', [[0, 0], [1, 0], [2, 0], [2, 1]], 0.9], ['l4b', [[0, 0], [0, 1], [0, 2], [1, 0]], 0.9],
    ['l4c', [[0, 0], [0, 1], [1, 1], [2, 1]], 0.9], ['l4d', [[0, 2], [1, 0], [1, 1], [1, 2]], 0.9],
    ['j4a', [[0, 1], [1, 1], [2, 1], [2, 0]], 0.9], ['j4b', [[0, 0], [1, 0], [1, 1], [1, 2]], 0.9],
    ['j4c', [[0, 0], [0, 1], [1, 0], [2, 0]], 0.9], ['j4d', [[0, 0], [0, 1], [0, 2], [1, 2]], 0.9],
    ['t4a', [[0, 0], [0, 1], [0, 2], [1, 1]], 1.1], ['t4b', [[0, 1], [1, 0], [1, 1], [2, 1]], 1.1],
    ['t4c', [[0, 1], [1, 0], [1, 1], [1, 2]], 1.1], ['t4d', [[0, 0], [1, 0], [1, 1], [2, 0]], 1.1],
    ['s4a', [[0, 1], [0, 2], [1, 0], [1, 1]], 0.9], ['s4b', [[0, 0], [1, 0], [1, 1], [2, 1]], 0.9],
    ['z4a', [[0, 0], [0, 1], [1, 1], [1, 2]], 0.9], ['z4b', [[0, 1], [1, 0], [1, 1], [2, 0]], 0.9],
    ['v5a', [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]], 0.45], ['v5b', [[0, 0], [0, 1], [0, 2], [1, 0], [2, 0]], 0.45],
    ['v5c', [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2]], 0.45], ['v5d', [[0, 2], [1, 2], [2, 0], [2, 1], [2, 2]], 0.45]
  ];
  var SHAPES = SHAPE_DEFS.map(function (d) {
    var cells = d[1];
    var rows = 0, cols = 0;
    cells.forEach(function (c) { rows = Math.max(rows, c[0] + 1); cols = Math.max(cols, c[1] + 1); });
    return { id: d[0], cells: cells, weight: d[2], rows: rows, cols: cols, n: cells.length };
  });
  var SHAPE = {};
  SHAPES.forEach(function (s) { SHAPE[s.id] = s; });

  // ---------- Biomes ----------
  // gaps: weights for the length (1-4 cells) of the one clean gap in each terrain row.
  // split: chance of a second, single-cell gap. stone/gold/gem: per-cell chances. chest/tnt/relic: per-row chances.
  var BIOMES = [
    { id: 'meadow', name: 'Meadow Soil', gaps: [10, 25, 35, 30], split: 0.00, stone: 0.00, gold: 0.09, gem: 0.006, chest: 0.075, tnt: 0.000, relic: 0.05 },
    { id: 'clay', name: 'Clay Beds', gaps: [10, 25, 35, 30], split: 0.10, stone: 0.04, gold: 0.08, gem: 0.010, chest: 0.075, tnt: 0.020, relic: 0.05 },
    { id: 'granite', name: 'Granite Caves', gaps: [10, 25, 35, 30], split: 0.20, stone: 0.08, gold: 0.07, gem: 0.012, chest: 0.075, tnt: 0.030, relic: 0.05 },
    { id: 'crystal', name: 'Crystal Grotto', gaps: [10, 25, 35, 30], split: 0.25, stone: 0.08, gold: 0.04, gem: 0.040, chest: 0.075, tnt: 0.030, relic: 0.05 },
    { id: 'frozen', name: 'Frozen Depths', gaps: [10, 25, 35, 30], split: 0.30, stone: 0.11, gold: 0.06, gem: 0.016, chest: 0.075, tnt: 0.035, relic: 0.05 },
    { id: 'magma', name: 'Magma Chambers', gaps: [10, 25, 35, 30], split: 0.35, stone: 0.13, gold: 0.06, gem: 0.016, chest: 0.075, tnt: 0.060, relic: 0.05 },
    { id: 'ruins', name: 'Ancient Ruins', gaps: [10, 25, 35, 30], split: 0.40, stone: 0.15, gold: 0.06, gem: 0.016, chest: 0.11, tnt: 0.035, relic: 0.05 },
    { id: 'core', name: 'The Core', gaps: [10, 25, 35, 30], split: 0.50, stone: 0.17, gold: 0.07, gem: 0.030, chest: 0.075, tnt: 0.040, relic: 0.05 }
  ];
  function biomeIndex(depth) {
    var i = 0;
    while (i + 1 < BIOME_STARTS.length && depth >= BIOME_STARTS[i + 1]) i++;
    return i;
  }
  function riseEvery(depth) {
    var k = CFG.rise[0][1];
    for (var i = 0; i < CFG.rise.length; i++) if (depth >= CFG.rise[i][0]) k = CFG.rise[i][1];
    return k;
  }
  function helpChance(depth) { return Math.max(CFG.help[2], CFG.help[0] - depth / CFG.help[1]); }

  // ---------- Board ----------
  function emptyBoard() { var b = new Array(N); for (var i = 0; i < N; i++) b[i] = 0; return b; }
  function canPlace(b, s, r, c) {
    if (r < 0 || c < 0 || r + s.rows > ROWS || c + s.cols > COLS) return false;
    var cells = s.cells;
    for (var i = 0; i < cells.length; i++) if (b[(r + cells[i][0]) * COLS + c + cells[i][1]] !== 0) return false;
    return true;
  }
  function fits(b, s) {
    for (var r = 0; r + s.rows <= ROWS; r++) for (var c = 0; c + s.cols <= COLS; c++) if (canPlace(b, s, r, c)) return true;
    return false;
  }
  function placements(b, s) {
    var out = [];
    for (var r = 0; r + s.rows <= ROWS; r++) for (var c = 0; c + s.cols <= COLS; c++) if (canPlace(b, s, r, c)) out.push([r, c]);
    return out;
  }
  function place(b, s, r, c, color) {
    var out = [];
    for (var i = 0; i < s.cells.length; i++) {
      var p = (r + s.cells[i][0]) * COLS + c + s.cells[i][1];
      b[p] = mk(K.BLOCK, color, 0);
      out.push(p);
    }
    return out;
  }
  function rowFull(b, r) { for (var c = 0; c < COLS; c++) if (b[r * COLS + c] === 0) return false; return true; }
  function colFull(b, c) { for (var r = 0; r < ROWS; r++) if (b[r * COLS + c] === 0) return false; return true; }
  function fullLines(b) {
    var rows = [], cols = [], r, c;
    for (r = 0; r < ROWS; r++) if (rowFull(b, r)) rows.push(r);
    for (c = 0; c < COLS; c++) if (colFull(b, c)) cols.push(c);
    return { rows: rows, cols: cols };
  }
  // Lines a piece would complete at (r,c), without changing the board.
  function linesIf(b, s, r, c) {
    var i, p, cells = s.cells, rows = [], cols = [];
    for (i = 0; i < cells.length; i++) b[(r + cells[i][0]) * COLS + c + cells[i][1]] = -1;
    for (i = r; i < r + s.rows; i++) if (rowFull(b, i)) rows.push(i);
    for (i = c; i < c + s.cols; i++) if (colFull(b, i)) cols.push(i);
    for (i = 0; i < cells.length; i++) { p = (r + cells[i][0]) * COLS + c + cells[i][1]; b[p] = 0; }
    return { rows: rows, cols: cols };
  }

  function newOut() { return { removed: [], cracked: [], blasts: [], gold: 0, gems: 0, chests: [], relics: [] }; }
  // Hit one cell: stone cracks, everything else breaks. TNT is queued to explode.
  function hitCell(b, p, out, queue, wave) {
    var v = b[p];
    if (v === 0) return;
    var k = v & 15;
    if (k === K.STONE) { b[p] = mk(K.CRACK, tint(v), vari(v)); out.cracked.push({ p: p, w: wave }); return; }
    b[p] = 0;
    out.removed.push({ p: p, v: v, w: wave });
    if (k === K.GOLD) out.gold++;
    else if (k === K.GEM) out.gems++;
    else if (k === K.CHEST) out.chests.push({ p: p, t: tint(v) });
    else if (k === K.RELIC) out.relics.push({ p: p, t: tint(v) });
    else if (k === K.TNT) queue.push(p);
  }
  function explode(b, queue, out, wave) {
    var q = queue;
    while (q.length) {
      var next = [];
      wave++;
      for (var i = 0; i < q.length; i++) {
        var p = q[i], r = (p / COLS) | 0, c = p % COLS;
        out.blasts.push({ p: p, w: wave });
        for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
          var rr = r + dr, cc = c + dc;
          if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || (dr === 0 && dc === 0)) continue;
          hitCell(b, rr * COLS + cc, out, next, wave);
        }
      }
      q = next;
    }
  }
  function resolveLines(b, rows, cols) {
    var out = newOut(), seen = {}, list = [], i, j, p;
    for (i = 0; i < rows.length; i++) for (j = 0; j < COLS; j++) { p = rows[i] * COLS + j; if (!seen[p]) { seen[p] = 1; list.push(p); } }
    for (i = 0; i < cols.length; i++) for (j = 0; j < ROWS; j++) { p = j * COLS + cols[i]; if (!seen[p]) { seen[p] = 1; list.push(p); } }
    var queue = [];
    for (i = 0; i < list.length; i++) hitCell(b, list[i], out, queue, 0);
    explode(b, queue, out, 0);
    return out;
  }
  // TNT booster: blasts a 3x3 area centred on p (centre included).
  function blastAt(b, p) {
    var out = newOut(), queue = [];
    hitCell(b, p, out, queue, 0);
    var r = (p / COLS) | 0, c = p % COLS;
    out.blasts.push({ p: p, w: 0 });
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      var rr = r + dr, cc = c + dc;
      if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || (dr === 0 && dc === 0)) continue;
      hitCell(b, rr * COLS + cc, out, queue, 0);
    }
    explode(b, queue, out, 0);
    return out;
  }
  // Pickaxe booster: removes one cell completely (stone included).
  function pickAt(b, p) {
    var out = newOut(), v = b[p];
    if (v === 0) return out;
    if ((v & 15) === K.STONE || (v & 15) === K.CRACK) { b[p] = 0; out.removed.push({ p: p, v: v, w: 0 }); return out; }
    var queue = [];
    hitCell(b, p, out, queue, 0);
    explode(b, queue, out, 0);
    return out;
  }

  function canRise(b) { for (var c = 0; c < COLS; c++) if (b[c] !== 0) return false; return true; }
  function rise(b, row) {
    for (var i = 0; i < N - COLS; i++) b[i] = b[i + COLS];
    for (var c = 0; c < COLS; c++) b[N - COLS + c] = row[c];
  }
  function bottomRow(b) { return b.slice(N - COLS); }

  // ---------- Terrain ----------
  function pickLen(rnd, w) {
    var t = w[0] + w[1] + w[2] + w[3], x = rnd() * t;
    for (var i = 0; i < 4; i++) { x -= w[i]; if (x < 0) return i + 1; }
    return 4;
  }
  function genRow(rnd, depth, above, mods) {
    mods = mods || {};
    var bi = biomeIndex(depth), B = BIOMES[bi], c;
    var over = Math.max(0, depth - BIOME_STARTS[BIOME_STARTS.length - 1]);
    var L = pickLen(rnd, B.gaps);
    var start = rnd.int(COLS - L + 1);
    if (above && rnd() < 0.35) {
      // line the gap up with an open cell in the row above, making a deeper cavity
      var opens = [];
      for (c = 0; c < COLS; c++) if (above[c] === 0) opens.push(c);
      if (opens.length) { var o = opens[rnd.int(opens.length)]; start = Math.max(0, Math.min(COLS - L, o - rnd.int(L))); }
    }
    var hole = {};
    for (c = start; c < start + L; c++) hole[c] = 1;
    if (rnd() < Math.min(0.8, B.split + over / 400)) {
      var cand = [];
      for (c = 0; c < COLS; c++) if (!hole[c] && !hole[c - 1] && !hole[c + 1]) cand.push(c);
      if (cand.length) hole[cand[rnd.int(cand.length)]] = 1;
    }
    var row = new Array(COLS), solid = [];
    var gemMul = mods.gemMul || 1;
    for (c = 0; c < COLS; c++) {
      if (hole[c]) { row[c] = 0; continue; }
      solid.push(c);
      var k = K.DIRT, y = rnd();
      if (y < B.stone) k = K.STONE;
      else if (y < B.stone + B.gold) k = K.GOLD;
      else if (y < B.stone + B.gold + B.gem * gemMul) k = K.GEM;
      row[c] = mk(k, bi, rnd.int(256));

  }

// Animate everything a clear, blast or pickaxe removed.

  if (!out) return;
  var golds = 0;
  out.removed.forEach(function (e) {
    var at = tm + e.w * 120;
    G.dying.push({ p: e.p, v: e.v, t0: at });

      burst(e.p, e.v);
      var pt = cellXY(e.p);

      else if (k === K.GEM) { sparkle(pt.x, pt.y, THEMES[(e.v >> 4) & 15].gem, 10); Sound.gem(); }

// ---------- Boosters ----------

  if (R.over) { G.lockUntil = Infinity; schedule(tm + 650, onOver); }

    Modal.open('<h2>Demo store</h2><p>This preview never charges. In the app, this button opens the Google Play or App Store checkout for ' + esc(SKUS[sku].title) + ' (' + esc(SKUS[sku].price) + ').</p><div class="row2"><button class="btn secondary" data-act="no">Cancel</button><button class="btn primary" data-act="yes">Simulate purchase</button></div>',
      { yes: function () { res(true); Modal.onClose = null; Modal.close(); }, no: function () { res(false); Modal.onClose = null; Modal.close(); } },
      { onClose: function () { res(false); } });
  });
}
function openMuseum() {
  var d = Store.d;
  d.newRelics = 0; Store.save(); dots();
  var total = 0;
  RELICS.forEach(function (set, i) { set.forEach(function (_, j) { if (d.relics[i + '.' + j]) total++; }); });
  var html = '<h2>Museum</h2><p>' + total + ' of 32 relics found. Finish a set to unlock its perk for every dig.</p><div class="museum">';
  RELICS.forEach(function (set, i) {
    var found = 0;
    set.forEach(function (_, j) { if (d.relics[i + '.' + j]) found++; });
    html += '<div class="mset"><h3>' + esc(THEMES[i].name) + '<span>' + found + ' / 4</span></h3><div class="grid">' +
      set.map(function (r, j) { return d.relics[i + '.' + j] ? '<div class="relic" title="' + esc(r[1]) + '" aria-label="' + esc(r[1]) + '">' + r[0] + '</div>' : '<div class="relic missing" aria-label="Not found yet">?</div>'; }).join('') +
      '</div><div class="perk' + (found === 4 ? ' on' : '') + '">' + (found === 4 ? 'Perk active: ' : 'Perk: ') + esc(SET_PERKS[i].text) + '</div></div>';
  });
  Modal.open(html + '</div>', {});
}
function openMissions() {
  ensureMissions();
  var d = Store.d, st = d.missions.stats;
  var html = '<h2>Daily missions</h2><p>Fresh missions every day.</p><div class="list">';
  d.missions.list.forEach(function (m, i) {
    var def = missionDef(m.id), prog = Math.min(m.target, st[def.stat] || 0), done = prog >= m.target;
    html += '<div class="item' + (m.claimed ? ' done' : '') + '"><div class="ico">' + icon('i-missions') + '</div><div><div class="t">' + esc(def.text(m.target)) + '</div>' +
      '<div class="d">' + prog + ' / ' + m.target + ' · ' + m.reward + ' coins' + (m.gems ? ' + ' + m.gems + ' gems' : '') + '</div><div class="prog"><i style="width:' + Math.round(prog / m.target * 100) + '%"></i></div></div>' +
      (m.claimed ? '<b style="color:var(--moss)">Done</b>' : '<button class="btn ' + (done ? 'primary' : 'secondary') + '" data-act="claim-' + i + '"' + (done ? '' : ' disabled') + '>Claim</button>') + '</div>';
  });
  html += '</div>';
  var acts = {};
  d.missions.list.forEach(function (m, i) {
    acts['claim-' + i] = function () {
      if (m.claimed) return;
      m.claimed = true; grant({ coins: m.reward, gems: m.gems });
      Sound.chest(); toast('+' + m.reward + ' coins' + (m.gems ? ' +' + m.gems + ' gems' : ''));
      openMissions(); dots();
    };
  });
  Modal.open(html, acts);
}
function openSettings() {
  var html = '<h2>Settings</h2><div class="col">' + toggleRow('sound', 'Sound') + toggleRow('music', 'Music') + toggleRow('haptics', 'Vibration') + toggleRow('motion', 'Screen shake and effects') + '</div>' +
    '<div class="col">' + (Platform.kind === 'native' ? '<button class="btn secondary" data-act="restore">Restore purchases</button>' : '') +
    (Platform.kind === 'native' && Platform.privacyOptions ? '<button class="btn secondary" data-act="privacy">Ad privacy choices</button>' : '') +
    (CONFIG.privacyUrl ? '<a class="btn secondary" href="' + esc(CONFIG.privacyUrl) + '" target="_blank" rel="noopener">Privacy policy</a>' : '') +
    '<button class="btn ghost" data-act="reset">Reset progress</button></div>' +
    '<p class="fine">UNDERGRID v' + CONFIG.version + ' · Fonts: Bungee and Baloo 2 (SIL Open Font License)</p>';
  var acts = toggleActs({
    privacy: function () { Modal.close(); Platform.privacyForm(); },
    restore: function () { Platform.restore().then(function (skus) { (skus || []).forEach(function (s) { if (s === 'remove_ads') Store.d.adsRemoved = true; if (s === 'starter_pack') Store.d.starterBought = true; }); Store.save(); toast(skus && skus.length ? 'Purchases restored.' : 'No purchases to restore.'); }); },
    reset: function () {
      Modal.open('<h2>Reset all progress?</h2><p>This deletes your coins, gems, relics, boosters and records on this device. It cannot be undone.</p><div class="row2"><button class="btn secondary" data-act="no">Keep it</button><button class="btn danger" data-act="yes">Reset</button></div>',
        { no: function () { openSettings(); }, yes: function () { var ads = Store.d.adsRemoved, starter = Store.d.starterBought; Store.d = defaultSave(); Store.d.adsRemoved = ads; Store.d.starterBought = starter; Store.save(); G.R = null; Modal.close(); showHome(); toast('Progress reset.'); } });
    }
  });
  Modal.open(html, acts);
}
function rewardLabel(r) {
  var parts = [];
  if (r.coins) parts.push(r.coins + ' coins');
  if (r.gems) parts.push(r.gems + ' gems');
  ['tnt', 'pick', 'shuffle'].forEach(function (k) { if (r[k]) parts.push(r[k] + ' ' + BOOSTER[k].name); });
  return parts.join(' + ');
}
function checkLogin() {
  var d = Store.d, today = ymdLocal();
  if (d.login.last === today || !d.tutorialDone) return false;
  var streak = dayDiff(d.login.last, today) === 1 ? (d.login.streak % 7) + 1 : 1;
  var reward = LOGIN_REWARDS[streak - 1];
  var html = '<h2>Daily reward</h2><p>Come back every day. Day 7 is the big one.</p><div class="days">' +
    LOGIN_REWARDS.map(function (r, i) {
      var day = i + 1, ico = r.tnt && !r.coins ? 'i-tnt' : r.pick ? 'i-pick' : r.shuffle ? 'i-shuffle' : r.gems && !r.coins ? 'i-gem' : 'i-coin';
      return '<div class="day' + (day === streak ? ' today' : '') + (day < streak ? ' got' : '') + (day === 7 ? ' wide' : '') + '">Day ' + day + icon(ico) + '<span>' + (r.coins || r.gems || r.tnt || r.pick || r.shuffle) + (day === 7 ? ' + more' : '') + '</span></div>';
    }).join('') + '</div><p><b style="color:var(--bone)">Today: ' + esc(rewardLabel(reward)) + '</b></p><div class="col">' +
    (Platform.hasRewarded() && !Platform.strict() && d.runs >= 2
      ? (pokiUI()
        ? '<div class="row2"><button class="btn primary" data-act="x1">Claim</button><button class="btn gem" data-act="x2">' + adIco() + 'Double</button></div>'
        : '<button class="btn gem" data-act="x2">' + adIco() + '<span class="stack">Claim double<small>Watch a short video</small></span></button><button class="btn primary" data-act="x1">Claim</button>')
      : '<button class="btn primary" data-act="x1">Claim</button>') + '</div>';
  function claim(mult) {
    var g = {};
    Object.keys(reward).forEach(function (k) { g[k] = reward[k] * mult; });
    grant(g); d.login = { last: today, streak: streak }; Store.save();
    Sound.chest(); toast('+' + rewardLabel(g)); Modal.close(); dots();
  }
  Modal.open(html, {
    x1: function () { claim(1); },
    x2: function (btn) { btn.disabled = true; Platform.rewarded('login').then(function (ok) { if (ok) claim(2); else { btn.disabled = false; noReward('The video did not finish. You can still claim the normal reward.'); } }); }
  }, { dismiss: false });
  return true;
}

// ---------- Boot ----------
function bindUI() {
  cv = $('cv'); ctx = cv.getContext('2d');
  bgc = $('bg'); bgx = bgc.getContext('2d');
  heroCv = $('moHero'); heroCtx = heroCv.getContext('2d');
  Modal.el = $('modal'); Modal.sheet = Modal.el.querySelector('.sheet');
  Modal.el.addEventListener('click', function (e) { Modal.click(e); });
  cv.addEventListener('pointerdown', onDown, { passive: false });
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  cv.addEventListener('lostpointercapture', function (e) { if (G.drag && e.pointerId === G.drag.id) onUp(e); });
  document.addEventListener('pointerdown', function () { Sound.unlock(); }, { passive: true });
  document.addEventListener('touchend', function () { if (Sound.ctx && Sound.ctx.state !== 'running') { try { Sound.ctx.resume(); } catch (e) {} } }, { passive: true });
  $('btnPlay').addEventListener('click', function () { Sound.unlock(); Sound.ui(); preroll(function () { startRun('endless'); }); });
  $('btnContinue').addEventListener('click', function () { Sound.unlock(); Sound.ui(); preroll(continueRun); });
  $('btnNew').addEventListener('click', function () {
    Sound.unlock(); Sound.ui();
    Modal.open('<h2>Start a new dig?</h2><p>Your saved dig ends and you keep what it found.</p><div class="row2"><button class="btn secondary" data-act="no">Cancel</button><button class="btn primary" data-act="yes">New dig</button></div>',
      { no: function () { Modal.close(); }, yes: function () { Modal.close(); preroll(function () { startRun('endless'); }); } });
  });
  $('btnDaily').addEventListener('click', function () { Sound.unlock(); Sound.ui(); preroll(function () { startRun('daily'); }); });
  $('btnPause').addEventListener('click', function () { Sound.ui(); openPause(); });
  document.querySelectorAll('.dock button').forEach(function (b) {
    b.addEventListener('click', function () {
      Sound.unlock(); Sound.ui();
      var w = b.getAttribute('data-open');
      if (w === 'museum') openMuseum(); else if (w === 'missions') openMissions(); else if (w === 'shop') openShop(); else openSettings();
    });
  });
  document.querySelectorAll('.boost').forEach(function (b) {
    b.addEventListener('click', function () { Sound.unlock(); Sound.ui(); onBoosterTap(b.getAttribute('data-boost')); });
  });
  heroCv.addEventListener('pointerdown', function () { Sound.unlock(); G.heroMood = Math.random() < 0.5 ? 'happy' : 'wow'; G.heroUntil = nowMs() + 900; Sound.tone(660, 0.12, 'triangle', 0.1); Sound.tone(990, 0.16, 'triangle', 0.08, { at: 0.06 }); });
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 200); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { persistRun(); Store.save(); if (Sound.ctx) Sound.music(false); }
    else Sound.apply();
  });
  window.addEventListener('pagehide', function () { persistRun(); Store.save(); });
  window.addEventListener('keydown', function (e) {
    var k = e.key, typing = e.target && e.target.closest && e.target.closest('input, textarea, select');
    // Arrow, page and space keys must not scroll the portal page around the game (Poki asks for this).
    if (!typing && (/^(Arrow|Page)/.test(k) || (k === ' ' && !(e.target && e.target.closest && e.target.closest('button'))))) e.preventDefault();
    if (Platform.inAd) return; // no keyboard input while an ad plays
    if (k === 'Escape' || k === 'p' || k === 'P') {
      if (!Modal.el.hidden && Modal.dismiss) Modal.close();
      else if (screen === 'game' && Modal.el.hidden) openPause();
    }
  });
  // Mouse wheel: scroll a sheet that has more to show, never the page around the game.
  window.addEventListener('wheel', function (e) {
    var s = e.target && e.target.closest ? e.target.closest('.sheet') : null;
    if (!s || s.scrollHeight <= s.clientHeight + 1) e.preventDefault();
  }, { passive: false });
  // Android back button in the app: close a sheet, pause a dig, or send the app to the background from home.
  var capApp = Platform.kind === 'native' && window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (capApp && capApp.addListener) {
    try {
      capApp.addListener('backButton', function () {
        if (!$('adOverlay').hidden) return;
        if (!Modal.el.hidden) { if (Modal.dismiss) Modal.close(); }
        else if (screen === 'game') openPause();
        else if (capApp.minimizeApp) capApp.minimizeApp();
      });
    } catch (e) {}
  }
}
function start() {
  Platform.detect();
  if (Platform.strict()) document.documentElement.classList.add('strict-ads');
  if (pokiUI()) document.documentElement.classList.add('poki-ads');
  applyWide();
  return Store.load().then(function () {
    bindUI();
    sizeBg();
    ensureMissions();
    showHome();
    requestAnimationFrame(frame);
    if (document.fonts && document.fonts.load) document.fonts.load('400 20px Bungee').then(function () { Sprites.cache = {}; }).catch(function () {});
    return Platform.init();
  }).then(function () {
    Platform.loaded();
    dots();
    // First visit on Poki, CrazyGames or your own website: straight into the guided first dig (portals measure how many
    // visitors start playing). gameplayStart waits for the player's first touch, as the portals require.
    var d = Store.d;
    if ((Platform.kind === 'poki' || Platform.kind === 'crazygames' || Platform.kind === 'none') && !d.tutorialDone && !d.run && screen === 'home' && Modal.el.hidden) {
      G.awaitInput = true; startRun('endless');
    }
  }).catch(function (e) { console.error('boot failed', e); });
}
// Test hook: only exposed when a test harness sets window.UG_TEST before the game loads.
if (window.UG_TEST) window.__ug = { G: G, V: V, Store: Store, UG: UG, startRun: startRun, finishRun: finishRun, showHome: showHome, hud: hud, Modal: Modal, Platform: Platform, banner: banner, floatText: floatText, openMuseum: openMuseum, showResults: showResults, layout: layout, showOverModal: showOverModal, startGameplay: startGameplay };
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(function () { persistRun(); Store.save(); return {}; }); } catch (e) {}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();

})();
</script>
